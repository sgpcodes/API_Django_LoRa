services:
  - type: web
    name: api-monitoramento-meteorologico
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn api_root.wsgi --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      # Só defina isso (ex.: 60) DEPOIS de trocar a connection string do
      # Supabase pro Transaction pooler (porta 6543) — ver settings.py.
      # Sem essa variável, o Django usa 0 (seguro com o Session pooler).
      - key: DB_CONN_MAX_AGE
        sync: false
