services:
  - type: web
    name: api-monitoramento-meteorologico
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    # O `(... &)` antes do gunicorn sobe em paralelo, em segundo plano, a
    # coleta das estações tipo=online (Open-Meteo) a cada 10 min — mesmo
    # papel do loop em docker/backend/entrypoint.sh, que só é usado na
    # instalação local/Raspberry Pi (o Render não lê aquele arquivo, sobe
    # direto por este startCommand). Sem estação online cadastrada, o
    # comando só não faz nada a cada ciclo (barato).
    startCommand: (while true; do python manage.py coletar_dados_online; sleep 600; done &) ; gunicorn api_root.wsgi --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      # Só defina isso (ex.: 60) DEPOIS de trocar a connection string do
      # Supabase pro Transaction pooler (porta 6543) — ver settings.py.
      # Sem essa variável, o Django usa 0 (seguro com o Session pooler).
      - key: DB_CONN_MAX_AGE
        sync: false
