name: Keep-alive do backend (Render free tier)

# O plano free do Render hiberna o serviço depois de ~15 min sem
# tráfego, e a primeira requisição depois disso pode levar 30-60s+
# pra responder — tempo suficiente pro ESP32 receptor perder pacotes
# LoRa enquanto espera a resposta de /api/rssi/status/. Este workflow
# só faz um GET periódico num endpoint leve pra manter o serviço
# acordado, sem custo (roda em runner do GitHub, de graça).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /api/rssi/status/
        run: |
          curl -sS -o /dev/null -w "status=%{http_code} tempo=%{time_total}s\n" \
            https://api-monitoramento-meteorologico.onrender.com/api/rssi/status/
